name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Offline unit tests (no network; output-dependent tests skip without local data)
        run: pytest -q
