[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-cambodia"
version = "0.0.1"
description = "Satellite-based agricultural and land-cover monitoring in Cambodia (research pilot)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "pyarrow", "scipy", "matplotlib", "psutil",
  "geopandas", "shapely", "pyproj", "rasterio", "pystac-client", "folium",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to STAC/COG services (deselect with -m 'not network')"]
